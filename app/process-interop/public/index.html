<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Exchange Identity</title>
</head>
<body>
    <h1>Enter Request ID</h1>
    <form id="processForm">
        <label for="requestId">Request ID:</label>
        <input type="text" id="requestId" name="requestId" required>
        <br><br>
        <button type="submit">ProcessExchangeIdentity</button>
    </form>

    <div id="message"></div>

    <script>
        const form = document.getElementById('processForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const requestId = document.getElementById('requestId').value;

            // Call the server-side function
            const response = await fetch('/process-exchange', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ requestId })
            });

            const data = await response.json();
            const messageDiv = document.getElementById('message');
            if (data.success) {
                messageDiv.innerText = 'Process completed successfully.';
            } else {
                messageDiv.innerText = 'Process failed: ' + data.message;
            }
        });
    </script>
</body>
</html>
